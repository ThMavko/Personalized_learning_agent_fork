name: Test

# Solo test: non tocca stato, log né report. I commit automatici della
# newsletter hanno [skip ci], quindi non fanno partire questo workflow.
on:
  push:
    paths: ["src/**", "tests/**", "config/**", "requirements*.txt", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
